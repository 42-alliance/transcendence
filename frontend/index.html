<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-i18n="app-title">Dragon Pong - Modern Gaming</title>

		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>

		<!-- Fonts - Poppins -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet" />

		<!-- Game Screens Styles -->
		<link
			rel="stylesheet"
			type="text/css"
			href="/src/Views/Game/UI/screens/DifficultyScreen.css" />

		<!-- Icons -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="/assets/favicon.ico" />

		<script>
			tailwind.config = {
				theme: {
					extend: {
						fontFamily: {
							poppins: ["Poppins", "sans-serif"],
						},
						animation: {
							"fade-in": "fadeIn 0.3s ease-out",
							"slide-up": "slideUp 0.3s ease-out",
							"slide-down": "slideDown 0.3s ease-out",
							"scale-in": "scaleIn 0.2s ease-out",
						},
						backdropBlur: {
							xs: "2px",
						},
						colors: {
							glass: "rgba(255, 255, 255, 0.1)",
							"glass-border": "rgba(255, 255, 255, 0.2)",
						},
					},
				},
			};
		</script>

		<style>
			@keyframes fadeIn {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
			@keyframes slideUp {
				from {
					opacity: 0;
					transform: translateY(20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			@keyframes slideDown {
				from {
					opacity: 1;
					transform: translateY(0);
				}
				to {
					opacity: 0;
					transform: translateY(20px);
				}
			}
			@keyframes scaleIn {
				from {
					opacity: 0;
					transform: scale(0.9);
				}
				to {
					opacity: 1;
					transform: scale(1);
				}
			}
			.glass-effect {
				background: rgba(255, 255, 255, 0.1);
				backdrop-filter: blur(20px);
				border: 1px solid rgba(255, 255, 255, 0.2);
			}
			.glass-dark {
				background: rgba(0, 0, 0, 0.3);
				backdrop-filter: blur(20px);
				border: 1px solid rgba(255, 255, 255, 0.1);
			}
			.gradient-primary {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			}
			.gradient-secondary {
				background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
			}
			.gradient-accent {
				background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
			}
			.text-gradient {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}
		</style>
	</head>

		<script>
			// Modal helpers
			function showModal(modalId) {
				const modal = document.getElementById(modalId);
				if (!modal) return;
				modal.classList.remove("hidden", "animate-slide-down");
				modal.classList.add("animate-slide-up");
				// modal.classList.remove("hidden");
				// modal.classList.add("show");
			}

			function hideModal(modalId) {
				const modal = document.getElementById(modalId);
				if (!modal) return;
				// modal.classList.remove("show");
				// setTimeout(() => {
				//   modal.classList.add("hidden");
				// }, 300);

				modal.classList.remove("animate-slide-up");
				modal.classList.add("animate-slide-down");

				setTimeout(() => {
					modal.classList.add("hidden");
				}, 300);
			}

			// Click outside to close any "...-modal"
			document.querySelectorAll('[id$="-modal"]').forEach(modal => {
				modal.addEventListener("click", function (e) {
					if (e.target === this) {
						hideModal(this.id);
					}
				});
			});
		</script>
