<div class="glass-dark rounded-3xl p-8 w-full max-w-md mx-4 animate-scale-in">
	<h2
		class="text-2xl font-bold text-gradient mb-4"
		data-i18n="2fa-login-title">
		Two-Factor Authentication
	</h2>
	<p class="text-gray-300 mb-6 leading-relaxed" data-i18n="2fa-login-desc">
		Please enter your 6-digit authentication code to continue.
	</p>
	<input
		type="text"
		id="login-verification-code"
		class="w-full p-4 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-2xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-opacity-15 transition-all duration-300 text-center text-2xl font-mono tracking-widest mb-6"
		maxlength="6"
		data-i18n="2fa-login-placeholder"
		data-i18n-attr="placeholder"
		placeholder="000000" />
	<div class="flex gap-3">
		<button
			id="cancel-login-2fa"
			class="flex-1 px-6 py-3 bg-white bg-opacity-10 hover:bg-opacity-20 rounded-xl transition-all duration-300 font-medium"
			data-i18n="2fa-cancel">
			Cancel
		</button>
		<button
			id="verify-login-2fa"
			class="flex-1 px-6 py-3 gradient-primary hover:shadow-lg hover:shadow-purple-500/25 rounded-xl transition-all duration-300 font-medium"
			data-i18n="2fa-login-verify">
			Verify & Login
		</button>
	</div>
</div>
