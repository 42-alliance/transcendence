<div class="glass-dark rounded-3xl p-8 w-full max-w-lg mx-4 animate-scale-in">
	<h2
		class="text-2xl font-bold text-gradient mb-6"
		data-i18n="2fa-setup-title">
		Setup Two-Factor Authentication
	</h2>

	<!-- QR Code -->
	<div class="flex justify-center mb-6">
		<div
			class="bg-white bg-opacity-10 rounded-2xl p-4 border border-white border-opacity-20">
			<img id="qrcode-image" alt="QR Code" class="rounded-xl" />
		</div>
	</div>

	<!-- Instructions -->
	<div class="space-y-4 mb-6">
		<div class="flex items-start gap-3">
			<div
				class="w-6 h-6 rounded-full gradient-primary flex items-center justify-center text-sm font-bold mt-0.5">
				1
			</div>
			<p class="text-gray-300" data-i18n="2fa-step1">
				Scan this QR code with your authenticator app (Google
				Authenticator, Authy, etc.)
			</p>
		</div>
		<div class="flex items-start gap-3">
			<div
				class="w-6 h-6 rounded-full gradient-primary flex items-center justify-center text-sm font-bold mt-0.5">
				2
			</div>
			<div class="flex-1">
				<p class="text-gray-300 mb-2" data-i18n="2fa-step2-label">
					Enter the verification code from your app:
				</p>
				<input
					type="text"
					id="verification-code"
					class="w-full p-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-opacity-15 transition-all duration-300 text-center font-mono tracking-widest"
					maxlength="6"
					data-i18n="2fa-setup-placeholder"
					data-i18n-attr="placeholder"
					placeholder="000000" />
			</div>
		</div>
	</div>

	<!-- Buttons -->
	<div class="flex gap-3">
		<button
			id="cancel-2fa"
			class="flex-1 px-6 py-3 bg-white bg-opacity-10 hover:bg-opacity-20 rounded-xl transition-all duration-300 font-medium"
			data-i18n="2fa-cancel">
			Cancel
		</button>
		<button
			id="verify-2fa"
			class="flex-1 px-6 py-3 gradient-primary hover:shadow-lg hover:shadow-purple-500/25 rounded-xl transition-all duration-300 font-medium"
			data-i18n="2fa-enable">
			Enable 2FA
		</button>
	</div>
</div>
