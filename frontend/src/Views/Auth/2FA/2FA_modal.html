<!-- 2FA Modal -->
<!-- Exemple pour la modale principale -->
<div id="2FA-default-modal"
     class="opacity-0 pointer-events-none transition-opacity duration-300 fixed inset-0 z-50 flex items-center justify-center bg-[rgba(0,0,0,0.5)]">
  <div class="relative bg-white dark:bg-gray-700 rounded-lg shadow-lg w-full max-w-2xl p-4">
    
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-600 pb-4">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Enable Two-Factor Authentication</h3>
      <button id="close-modal-btn" class="text-gray-400 hover:text-gray-900 dark:hover:text-white" aria-label="Close modal">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="mt-4 space-y-4 text-gray-500 dark:text-gray-400">
      <p>
        For better account security, we recommend enabling Two-Factor Authentication (2FA).
      </p>
      <p>
        2FA adds an extra layer of protection to your account by requiring a second step of verification when you log in.
      </p>
      <p>
        Would you like to enable 2FA now?
      </p>
    </div>

    <!-- Footer -->
    <div class="mt-6 flex justify-end space-x-2">
      <button id="enable-2fa-btn" class="bg-blue-700 hover:bg-blue-800 text-white font-medium rounded-lg text-sm px-5 py-2.5">Yes, enable 2FA</button>
      <button id="decline-btn" class="bg-white text-gray-900 border border-gray-300 hover:bg-gray-100 hover:text-blue-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:text-white rounded-lg text-sm px-5 py-2.5">No, maybe later</button>
    </div>
    
  </div>
</div>
