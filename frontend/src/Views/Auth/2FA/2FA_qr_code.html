<!-- Second modal (setup) -->
<!-- Et pour la modale de setup -->
<div id="2FA-setup-modal"
     class="opacity-0 pointer-events-none transition-opacity duration-300 fixed inset-0 z-50 flex items-center justify-center bg-[rgba(0,0,0,0.5)]">
  <div class="relative bg-white dark:bg-gray-700 rounded-lg shadow-lg w-full max-w-lg p-6">

    <!-- Header -->
    <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-600 pb-4">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Set up 2FA</h3>
      <button id="close-setup-btn" class="text-gray-400 hover:text-gray-900 dark:hover:text-white" aria-label="Close">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="mt-4 text-gray-600 dark:text-gray-300">
      <p class="mb-4">Scan this QR code with your authenticator app:</p>
      <div class="flex justify-center mb-4">
        <img id="qrcode" src="/qrcode.png" alt="QR Code" class="w-40 h-40" />
      </div>

      <form id="verify-2fa-form" class="space-y-4">
        <label for="code" class="block text-sm font-medium">Enter the 6-digit code:</label>
        <input type="text" id="code" name="code" maxlength="6" required class="w-full p-2 border rounded" />
		<p id="2fa-error" class="text-red-600 mt-2 text-sm hidden">
		The 2FA code is invalid. Please try again.
		</p>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2">Verify</button>
      </form>
	  
    </div>

  </div>
</div>
