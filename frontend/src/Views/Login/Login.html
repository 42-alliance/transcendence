<section
  class="fixed inset-0 pt-20 flex flex-col items-center justify-center min-h-0 px-4"
  data-i18n-attr="aria-label:auth-section-aria"
  aria-label="Authentication section"
>
  <div
    class="hidden lg:block h-[700px] w-[1000px] rounded-[15px] overflow-hidden bg-[#1a1826] shadow-2xl shadow-black/50 border border-gray-700/30"
    id="card-login-container-id"
    role="region"
    data-i18n-attr="aria-label:login-card-desktop-aria"
    aria-label="Login card (desktop)"
  >
  </div>

  <!-- Version responsive pour écrans plus petits -->
  <div
    class="lg:hidden w-full max-w-md h-[500px] rounded-[15px] overflow-hidden bg-[#1a1826] shadow-2xl shadow-black/50 border border-gray-700/30"
    id="card-login-container-mobile"
    role="region"
    data-i18n-attr="aria-label:login-card-mobile-aria"
    aria-label="Login card (mobile)"
  >
  </div>
</section>
