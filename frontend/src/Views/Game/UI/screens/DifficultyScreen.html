<div class="screen difficulty-screen">
  <div class="screen-content">
    <h2 class="screen-title">SELECT DIFFICULTY</h2>
    <div class="cards-container">
      <div class="card" id="easy">
        <div class="card-image">
          <img src="assets/game/Ia_difficulty/easy.webp" alt="Easy Mode" />
        </div>
        <div class="card-overlay"></div>
        <div class="card-content">
          <h3 class="card-title">Easy</h3>
          <p class="card-description">Perfect for beginners</p>
        </div>
      </div>
      <div class="card" id="medium">
        <div class="card-image">
          <img src="assets/game/Ia_difficulty/medium.webp" alt="Medium Mode" />

        <div class="card-overlay"></div>
        <div class="card-content">
          <h3 class="card-title">Medium</h3>
          <p class="card-description">For experienced players</p>
        </div>
      </div>
      <div class="card" id="hard">
        <div class="card-image">
          <img src="assets/game/Ia_difficulty/hard.webp" alt="Hard Mode" />
        </div>
        <div class="card-overlay"></div>
        <div class="card-content">
          <h3 class="card-title">Hard</h3>
