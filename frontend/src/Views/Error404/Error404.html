<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-[#191a2c] to-[#1a1826] text-white px-4 py-12">

    src="/assets/not_found.gif"
    alt="User Not Found"
    class="mb-4 mt-8 w-80 max-w-full opacity-80 select-none pointer-events-none"
    loading="lazy"
    data-i18n="notfound-img-alt"
    data-i18n-attr="alt"
  />

  <div class="text-2xl font-bold mb-2" data-i18n="notfound-title">

  <a

    data-i18n-attr="aria-label:notfound-back-aria"
